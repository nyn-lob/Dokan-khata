<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>দোকান খাতা</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f2;--card:#fff;--tx:#18221c;--mu:#66726a;--pr:#0d6b47;--prt:#fff;--rd:#b8321f;--bd:#dfe5df;--ac:#e6f1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--card:#19201b;--tx:#e8eee9;--mu:#9aa69d;--pr:#34c98a;--prt:#04231a;--rd:#ff7a66;--bd:#29322c;--ac:#1e2c23}}
:root[data-theme="dark"]{--bg:#101512;--card:#19201b;--tx:#e8eee9;--mu:#9aa69d;--pr:#34c98a;--prt:#04231a;--rd:#ff7a66;--bd:#29322c;--ac:#1e2c23}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans Bengali","Kalpurush","Nirmala UI",system-ui,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pr);color:var(--prt);padding:12px 16px;font-weight:700;font-size:19px;z-index:5}
main{padding:14px;max-width:640px;margin:auto}
h2{font-size:18px;margin:6px 0 10px}
h3{margin:0 0 10px;font-size:18px}
.mu,small{color:var(--mu)}
small{display:block;font-size:13px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.cd b{font-size:21px}
.rd{color:var(--rd)}
.b{display:inline-block;text-align:center;text-decoration:none;border:0;border-radius:12px;background:var(--pr);color:var(--prt);padding:11px 14px;font:inherit;font-weight:600;flex:1;cursor:pointer}
.b.g{background:var(--ac);color:var(--tx)}
.b.s{padding:5px 12px;flex:none}
.row{display:flex;gap:8px;margin:10px 0}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:7px 0;cursor:pointer}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 8px}
label{display:block;font-size:14px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:10px 0;cursor:pointer}
nav button.on{color:var(--pr);font-weight:700;box-shadow:inset 0 3px 0 var(--pr)}
#sh{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end}
#sh[hidden]{display:none}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.pn{position:relative;background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.big{font-size:26px;font-weight:700;margin:4px 0}
table{width:100%;border-collapse:collapse}
td,th{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}
td:first-child,th:first-child{text-align:left}
#tt{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:30;font-size:14px;max-width:90%}
#tt:empty{display:none}
.hist div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}
</style>
</head>
<body>
<header>🛒 দোকান খাতা</header>
<main id="app"></main>
<nav>
<button data-t="home" onclick="go('home')">হোম</button>
<button data-t="sell" onclick="go('sell')">বিক্রি</button>
<button data-t="cust" onclick="go('cust')">বাকি</button>
<button data-t="stock" onclick="go('stock')">স্টক</button>
<button data-t="more" onclick="go('more')">আরও</button>
</nav>
<div id="sh" hidden></div>
<div id="tt"></div>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db={c:[],p:[],s:[],x:[]},tab='home',cur=null,cart=[],sq='';
try{const r=localStorage.getItem('dokan_v1');if(r)db=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem('dokan_v1',JSON.stringify(db))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const bn=n=>'৳'+Math.round(n).toLocaleString('bn-BD');
const dayOf=t=>new Date(t).toLocaleDateString('sv');
const dt=t=>new Date(t).toLocaleDateString('bn-BD',{day:'numeric',month:'short'});
const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const bal=c=>c.tx.reduce((a,t)=>a+(t.k==='due'?t.a:-t.a),0);
const card=(l,v,c)=>`<div class="cd"><small>${l}</small><b class="${c||''}">${bn(v)}</b></div>`;
const v=id=>$('#'+id).value.trim();
const n=id=>parseFloat(v(id))||0;
const inp=(id,l,val,t)=>`<label>${l}<input id="${id}" type="${t||'text'}" value="${E(val==null?'':val)}" ${t==='number'?'inputmode="decimal" step="any"':''}></label>`;
let tm;function toast(m){$('#tt').textContent=m;clearTimeout(tm);tm=setTimeout(()=>$('#tt').textContent='',2200)}
function sheet(title,body,ok,lbl){$('#sh').innerHTML=`<div class="bk" onclick="cs()"></div><div class="pn"><h3>${title}</h3>${body}<div class="row">${ok?`<button class="b" id="ok">${lbl||'সংরক্ষণ'}</button>`:''}<button class="b g" onclick="cs()">বন্ধ</button></div></div>`;$('#sh').hidden=false;if(ok)$('#ok').onclick=ok}
function cs(){$('#sh').hidden=true;$('#sh').innerHTML=''}
function conf(msg,fn){sheet(msg,'',()=>{fn();},'হ্যাঁ, মুছুন')}
function go(t){tab=t;render();scrollTo(0,0)}
function render(){$('#app').innerHTML=({home:vHome,sell:vSell,cust:vCust,stock:vStock,more:vMore})[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));if(tab==='sell')cartR()}

/* হোম */
function vHome(){
 const d=dayOf(Date.now()),ts=db.s.filter(s=>dayOf(s.t)===d),ex=sum(db.x.filter(x=>dayOf(x.t)===d),'a');
 const col=db.c.reduce((a,c)=>a+c.tx.filter(t=>t.k==='paid'&&dayOf(t.t)===d).reduce((q,t)=>q+t.a,0),0);
 const due=db.c.reduce((a,c)=>a+Math.max(bal(c),0),0);
 const low=db.p.filter(p=>p.q<=p.m),top=db.c.filter(c=>bal(c)>0).sort((a,b)=>bal(b)-bal(a)).slice(0,5);
 return `<h2>আজকের হিসাব</h2><div class="gr">${card('আজকের বিক্রি',sum(ts,'total'))}${card('নিট লাভ (খরচ বাদে)',sum(ts,'profit')-ex)}${card('আজ নগদ হাতে এলো',sum(ts,'paid')+col-ex)}${card('মোট বাকি পাবো',due,'rd')}</div>
 <div class="row"><button class="b" onclick="go('sell')">+ নতুন বিক্রি</button></div>
 <h2>স্টক কম (${low.length})</h2>${low.length?low.map(p=>`<div class="li" onclick="ep('${p.id}')"><span>${E(p.n)}</span><b class="rd">${p.q} বাকি</b></div>`).join(''):'<p class="mu">সব পণ্যের স্টক ঠিক আছে।</p>'}
 <h2>সবচেয়ে বেশি বাকি</h2>${top.length?top.map(c=>`<div class="li" onclick="cd('${c.id}')"><span>${E(c.n)}</span><b class="rd">${bn(bal(c))}</b></div>`).join(''):'<p class="mu">কারো কাছে বাকি নেই।</p>'}`}

/* বিক্রি */
function vSell(){return `<h2>নতুন বিক্রি</h2><input id="sq" placeholder="পণ্য খুঁজুন" value="${E(sq)}" oninput="sq=this.value;pl()"><div id="pl">${pRows()}</div><h2>কার্ট</h2><div id="ct"></div>
 <label>কাস্টমার (বাকির জন্য দরকার)<select id="cs"><option value="">— কাস্টমার নেই —</option>${db.c.map(c=>`<option value="${c.id}">${E(c.n)}</option>`).join('')}</select></label>
 <label>নগদ পেলাম (খালি রাখলে পুরো টাকা)<input id="pd" type="number" inputmode="decimal" step="any"></label>
 <div class="row"><button class="b" onclick="done()">বিক্রি সম্পন্ন</button></div>`}
function pRows(){const l=db.p.filter(p=>!sq||p.n.toLowerCase().includes(sq.toLowerCase()));return l.length?l.map(p=>`<div class="li" onclick="addC('${p.id}')"><span>${E(p.n)}<small>স্টক ${p.q}</small></span><b>${bn(p.s)}</b></div>`).join(''):'<p class="mu">কোনো পণ্য নেই। আগে "স্টক" ট্যাবে পণ্য যোগ করুন।</p>'}
function pl(){$('#pl').innerHTML=pRows()}
function addC(id){const p=db.p.find(x=>x.id===id),i=cart.find(x=>x.id===id);if(i)i.q++;else cart.push({id,n:p.n,q:1,p:p.s,c:p.b});cartR()}
function qc(k,d){cart[k].q+=d;if(cart[k].q<=0)cart.splice(k,1);cartR()}
function cartR(){const t=cart.reduce((a,i)=>a+i.q*i.p,0);$('#ct').innerHTML=cart.length?cart.map((i,k)=>`<div class="li" style="cursor:default"><span>${E(i.n)}<small>${bn(i.p)} প্রতি পিস</small></span><span style="display:flex;gap:8px;align-items:center"><button class="b g s" onclick="qc(${k},-1)">−</button><b>${i.q}</b><button class="b g s" onclick="qc(${k},1)">+</button></span></div>`).join('')+`<div class="li" style="cursor:default"><b>মোট</b><b>${bn(t)}</b></div>`:'<p class="mu">উপরে পণ্য ট্যাপ করে যোগ করুন।</p>'}
function done(){
 if(!cart.length)return toast('আগে পণ্য যোগ করুন');
 const tot=cart.reduce((a,i)=>a+i.q*i.p,0),cid=$('#cs').value;let paid=$('#pd').value===''?tot:n('pd');if(paid>tot)paid=tot;
 if(paid<tot&&!cid)return toast('বাকি রাখতে কাস্টমার বেছে নিন');
 const t=Date.now();cart.forEach(i=>{const p=db.p.find(x=>x.id===i.id);if(p)p.q-=i.q});
 db.s.push({id:uid(),t,total:tot,paid,profit:cart.reduce((a,i)=>a+i.q*(i.p-i.c),0),cid,items:cart.map(i=>({n:i.n,q:i.q,p:i.p}))});
 if(paid<tot)db.c.find(c=>c.id===cid).tx.push({k:'due',a:tot-paid,t,n:'বিক্রি'});
 cart=[];sq='';save();render();toast('বিক্রি সম্পন্ন হয়েছে ✓');if(paid<tot)smsAsk(cid,'due',tot-paid)}

/* বাকির খাতা */
function vCust(){return `<h2>বাকির খাতা</h2><div class="gr">${card('মোট পাবো',db.c.reduce((a,c)=>a+Math.max(bal(c),0),0),'rd')}<div class="cd"><small>কাস্টমার</small><b>${db.c.length} জন</b></div></div><div class="row"><button class="b" onclick="ac()">+ নতুন কাস্টমার</button></div><input id="q2" placeholder="নাম বা ফোন খুঁজুন" oninput="cl()"><div id="cl">${cList('')}</div>`}
function cList(q){const l=db.c.filter(c=>(c.n+(c.ph||'')).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>bal(b)-bal(a));return l.length?l.map(c=>{const b=bal(c);return `<div class="li" onclick="cd('${c.id}')"><span>${E(c.n)}<small>${E(c.ph||'')}</small></span><b class="${b>0?'rd':''}">${bn(Math.abs(b))}${b<0?' অগ্রিম':''}</b></div>`}).join(''):'<p class="mu">কোনো কাস্টমার নেই। উপরের বাটন থেকে যোগ করুন।</p>'}
function cl(){$('#cl').innerHTML=cList($('#q2').value)}
function ac(){sheet('নতুন কাস্টমার',inp('cn','নাম')+inp('cp','ফোন নম্বর','','tel')+inp('co','আগের বাকি (থাকলে)','','number'),()=>{if(!v('cn'))return toast('নাম লিখুন');const c={id:uid(),n:v('cn'),ph:v('cp'),tx:[]};if(n('co'))c.tx.push({k:'due',a:n('co'),t:Date.now(),n:'আগের বাকি'});db.c.push(c);save();cs();render()})}
function cd(id){const c=db.c.find(x=>x.id===id);cur=id;const b=bal(c);
 const msg=encodeURIComponent(`আসসালামু আলাইকুম ${c.n}, আপনার কাছে আমাদের দোকানের ${Math.round(b)} টাকা বাকি আছে। সুবিধামতো পরিশোধ করুন। ধন্যবাদ।`);
 sheet(E(c.n)+(c.ph?` <small>${E(c.ph)}</small>`:''),`<div class="big ${b>0?'rd':''}">${b>=0?'বাকি ':'অগ্রিম '}${bn(Math.abs(b))}</div><div class="row"><button class="b" onclick="tx('due')">বাকি দিলাম</button><button class="b" onclick="tx('paid')">জমা পেলাম</button></div>${c.ph&&b>0?`<div class="row"><a class="b g" href="sms:${E(c.ph)}?body=${msg}">SMS রিমাইন্ডার</a></div>`:''}<h2>লেনদেন</h2><div class="hist">${c.tx.length?c.tx.slice().reverse().map(t=>`<div><span>${dt(t.t)} · ${E(t.n||'')}</span><b class="${t.k==='due'?'rd':''}">${t.k==='due'?'+':'−'}${bn(t.a)}</b></div>`).join(''):'<p class="mu">কোনো লেনদেন নেই।</p>'}</div><div class="row"><button class="b g" onclick="dc()">কাস্টমার মুছুন</button></div>`)}
function tx(k){sheet(k==='due'?'বাকি দিলাম':'জমা পেলাম',inp('ta','টাকা','','number')+inp('tn','নোট (ঐচ্ছিক)'),()=>{const a=n('ta');if(!a)return toast('টাকার পরিমাণ দিন');db.c.find(c=>c.id===cur).tx.push({k,a,t:Date.now(),n:v('tn')||(k==='due'?'বাকি':'জমা')});save();render();smsAsk(cur,k,a)})}
function dc(){conf('এই কাস্টমার ও তার হিসাব মুছবেন?',()=>{db.c=db.c.filter(c=>c.id!==cur);save();cs();render()})}

function smsAsk(id,k,a){const c=db.c.find(x=>x.id===id);if(!c)return;const b=bal(c),sh=db.shop?` - ${db.shop}`:'';
 const m=(k==='due'?`আসসালামু আলাইকুম ${c.n}, আজ আপনার ${Math.round(a)} টাকা বাকি লেখা হয়েছে। মোট বাকি ${Math.round(b)} টাকা।`:`আসসালামু আলাইকুম ${c.n}, ${Math.round(a)} টাকা জমা পেয়েছি, ধন্যবাদ। এখন মোট বাকি ${Math.round(b)} টাকা।`)+sh;
 sheet('কাস্টমারকে SMS পাঠান',`<p>${E(m)}</p>`+(c.ph?`<div class="row"><a class="b" href="sms:${E(c.ph)}?body=${encodeURIComponent(m)}">📩 SMS পাঠান (${E(c.ph)})</a></div>`:'<p class="rd">এই কাস্টমারের ফোন নম্বর নেই, তাই SMS যাবে না।</p>')+`<div class="row"><button class="b g" onclick="cd('${id}')">কাস্টমারের খাতা</button></div>`)}
/* স্টক */
function vStock(){const val=db.p.reduce((a,p)=>a+Math.max(p.q,0)*p.b,0);return `<h2>স্টক</h2><div class="gr">${card('স্টকের মূল্য (কেনা দামে)',val)}<div class="cd"><small>মোট পণ্য</small><b>${db.p.length} টি</b></div></div><div class="row"><button class="b" onclick="ep()">+ নতুন পণ্য</button><button class="b g" onclick="seedP()">📋 বাজারদরের তালিকা</button></div><input id="q3" placeholder="পণ্য খুঁজুন" oninput="sl()"><div id="sl">${sList('')}</div>`}
function sList(q){const l=db.p.filter(p=>p.n.toLowerCase().includes(q.toLowerCase()));return l.length?l.map(p=>`<div class="li" onclick="ep('${p.id}')"><span>${E(p.n)}<small>কেনা ${bn(p.b)} · বেচা ${bn(p.s)}</small></span><b class="${p.q<=p.m?'rd':''}">${p.q}</b></div>`).join(''):'<p class="mu">কোনো পণ্য নেই। উপরের বাটন থেকে যোগ করুন।</p>'}
function sl(){$('#sl').innerHTML=sList($('#q3').value)}
function ep(id){const p=id?db.p.find(x=>x.id===id):{n:'',b:'',s:'',q:'',m:5};
 sheet(id?'পণ্য এডিট':'নতুন পণ্য',inp('pn','পণ্যের নাম',p.n)+inp('pb','কেনা দাম',p.b,'number')+inp('ps','বেচা দাম',p.s,'number')+inp('pq','বর্তমান স্টক',p.q,'number')+inp('pm','এর নিচে নামলে সতর্ক করো',p.m,'number')+(id?'<div class="row"><button class="b g" id="dp">পণ্য মুছুন</button></div>':''),()=>{
  if(!v('pn'))return toast('পণ্যের নাম লিখুন');
  const o={n:v('pn'),b:n('pb'),s:n('ps'),q:n('pq'),m:n('pm')};
  if(id)Object.assign(p,o);else db.p.push({id:uid(),...o});save();cs();render()});
 if(id)$('#dp').onclick=()=>conf('এই পণ্য মুছবেন?',()=>{db.p=db.p.filter(x=>x.id!==id);save();cs();render()})}

/* বাজারদরের তালিকা */

function vMore(){const ym=dayOf(Date.now()).slice(0,7),ms=db.s.filter(s=>dayOf(s.t).startsWith(ym)),me=sum(db.x.filter(x=>dayOf(x.t).startsWith(ym)),'a');
 let r='';for(let i=0;i<7;i++){const t=Date.now()-i*864e5,d=dayOf(t),s=db.s.filter(x=>dayOf(x.t)===d),e=sum(db.x.filter(x=>dayOf(x.t)===d),'a');r+=`<tr><td>${dt(t)}</td><td>${bn(sum(s,'total'))}</td><td>${bn(sum(s,'profit')-e)}</td></tr>`}
 return `<h2>এই মাসের হিসাব</h2><div class="gr">${card('বিক্রি',sum(ms,'total'))}${card('নিট লাভ',sum(ms,'profit')-me)}</div>
 <h2>গত ৭ দিন</h2><div class="cd"><table><tr><th>তারিখ</th><th>বিক্রি</th><th>নিট লাভ</th></tr>${r}</table></div>

 ${db.x.slice(-8).reverse().map(x=>`<div class="li" style="cursor:default"><span>${E(x.n)}<small>${dt(x.t)}</small></span><b>${bn(x.a)}</b></div>`).join('')}

function ax(){const a=n('xa');if(!a)return toast('টাকার পরিমাণ দিন');db.x.push({id:uid(),t:Date.now(),a,n:v('xn')||'খরচ'});save();render();toast('খরচ সংরক্ষিত ✓')}
function bkp(){const t=$('#bk');t.value=JSON.stringify(db);t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('কপি হয়েছে। নোটে বা হোয়াটসঅ্যাপে সেভ করুন'),()=>toast('কোডটি সিলেক্ট করে কপি করুন'))}catch(e){toast('কোডটি সিলেক্ট করে কপি করুন')}}
function rst(){try{const d=JSON.parse($('#bk').value);if(!d.c||!d.p||!d.s||!d.x)throw 0;db=d;save();render();toast('রিস্টোর হয়েছে ✓')}catch(e){toast('কোডটি সঠিক নয়')}}
render();
